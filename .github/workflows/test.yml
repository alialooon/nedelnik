name: Planner tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run planner logic tests
        run: node --test weekly-planner/tests/*.test.mjs
      - name: Smoke-test the planner in Chrome
        run: node weekly-planner/tests/smoke-browser.mjs

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm launcher does not invoke hidden PowerShell
        shell: pwsh
        run: |
          $paths = @('install_nedelnik.bat', 'weekly-planner/launcher/start.cmd')
          foreach ($path in $paths) {
            $content = Get-Content -Raw $path
            if ($content -match '(?i)powershell\.exe|executionpolicy\s+bypass|windowstyle\s+hidden') {
              throw "Disallowed legacy launcher behavior in $path"
            }
          }
      - name: Smoke-test launcher in Windows cmd
        shell: pwsh
        run: |
          $local = Join-Path $env:RUNNER_TEMP 'NedelnikSmoke'
          $pageDir = Join-Path $local 'Nedelnik\source\weekly-planner'
          New-Item -ItemType Directory -Force -Path $pageDir | Out-Null
          Set-Content -Path (Join-Path $pageDir 'planner-standalone.html') -Value '<!doctype html><title>Test</title>'
          $env:LOCALAPPDATA = $local
          $env:NEDELNIK_TEST_MODE = '1'
          & cmd.exe /d /c 'weekly-planner\launcher\start.cmd'
          if ($LASTEXITCODE -ne 0) { throw "Launcher exited with code $LASTEXITCODE" }
