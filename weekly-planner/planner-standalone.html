<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Планирование задач: список без даты, неделя, календарь и итоги дня." />
  <title>Задачи на неделю</title>
  <style>
/* A clean, independent reimplementation of a Brain Dump + daily planning workspace. */
:root {
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:#292d35; background:#fff;
  --surface:#fff;--canvas:#fafbfc;--stroke:#e9ebef;--muted:#969ca5;--ink:#252a33;
  --shadow:0 9px 26px rgba(22,30,47,.055);--blue:#5b87fa;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid #79a2ff;outline-offset:2px}
[hidden]{display:none!important}
.workspace{height:100dvh;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.app-header{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--stroke);padding:0 24px 0 19px;background:#fff;gap:20px}
.identity{display:flex;align-items:center;gap:11px;font-size:17px;letter-spacing:-.4px;white-space:nowrap}
.identity strong{font-weight:700}
.identity-icon{display:grid;grid-template-columns:repeat(2,5px);grid-template-rows:repeat(2,5px);place-content:center;gap:3px;width:30px;height:30px;border-radius:9px;background:#22252b}
.identity-icon i{display:block;width:5px;height:5px;background:#fff;border-radius:2px}
.identity-icon i:nth-child(2){opacity:.55}.identity-icon i:nth-child(3){opacity:.72}
.header-actions{display:flex;align-items:center;gap:9px}
.icon-action{height:34px;min-width:34px;display:inline-grid;place-items:center;border:1px solid var(--stroke);border-radius:9px;background:#fff;font-size:17px}
.icon-action:hover,.quiet-action:hover,.today-button:hover{background:#f2f4f7}
.quiet-action{background:#fff;border:1px solid var(--stroke);border-radius:8px;padding:8px 13px;font-weight:560}
.more-menu{position:relative}
.more-menu>summary{list-style:none;display:grid;place-items:center;width:36px;height:34px;border-radius:9px;border:1px solid var(--stroke);cursor:pointer;letter-spacing:2px}
.more-menu>summary::-webkit-details-marker{display:none}
.more-content{position:absolute;z-index:15;right:0;top:41px;width:185px;border:1px solid var(--stroke);border-radius:11px;background:#fff;box-shadow:var(--shadow);padding:6px}
.more-content button{border:0;background:transparent;display:block;text-align:left;width:100%;padding:10px;border-radius:7px}.more-content button:hover{background:#f3f6fa}
.work-area{flex:1;min-height:0;display:flex;overflow:hidden}
.inbox-panel{width:280px;flex:0 0 280px;border-right:1px solid var(--stroke);display:flex;flex-direction:column;min-height:0;background:#fdfdfd;transition:width .2s,flex-basis .2s,opacity .2s}
.workspace.inbox-hidden .inbox-panel{width:0;flex-basis:0;opacity:0;overflow:hidden;border:0}
.inbox-top{display:flex;align-items:center;justify-content:space-between;padding:25px 17px 0 22px;gap:9px}
.inbox-top h2{font-size:16px;margin:4px 0 0;font-weight:690;letter-spacing:-.45px}
.inbox-top h2 span{font-size:11px;padding:2px 7px;border-radius:6px;background:#edeff4;color:#69727d;margin-left:4px;vertical-align:middle}
.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.inbox-caption{padding:0 22px;margin:8px 0 17px;color:var(--muted);font-size:11px}
.quick-add{margin:0 15px 12px;display:flex;border:1px solid #dfe3e9;background:#fff;border-radius:9px;min-height:39px;box-shadow:0 3px 12px #161e2905}
.quick-add input{border:0;background:transparent;outline:none;width:100%;min-width:0;padding:8px 10px}
.quick-add input::placeholder{color:#aeb4bd}
.quick-add button{border:0;background:transparent;color:#6e7c96;font-size:21px;width:34px}
.inbox-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 13px 8px}
.inbox-empty{font-size:12px;line-height:1.7;padding:26px 14px;color:#a1a8b2;text-align:center}
.inbox-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border:1px solid var(--stroke);border-radius:10px;margin-bottom:7px;padding:10px 10px;box-shadow:0 1px 3px #18223004;cursor:grab}
.inbox-item:active{cursor:grabbing}.inbox-item.dragging,.task-tile.dragging{opacity:.4}
.inbox-item .item-main{flex:1;min-width:0}
.item-title{word-break:break-word;font-size:12px;color:#353b44}
.item-subline{display:flex;align-items:center;gap:7px;margin-top:6px;color:#979eaa;font-size:10px}
.category-dot{width:7px;height:7px;display:inline-block;border-radius:50%;flex:0 0 7px}
.category-dot.work{background:#ee697c}.category-dot.personal{background:#ffc45d}.category-dot.study{background:#9872fa}.category-dot.sport{background:#64c4a9}.category-dot.health{background:#76a9f3}.category-dot.other{background:#abb0bc}
.inbox-item button{border:0;background:transparent;color:#a1a8b0;padding:0 3px}.inbox-item button:hover{color:#2d3544}
.inbox-bottom{border-top:1px solid var(--stroke);padding:11px 18px 16px;display:grid;gap:7px;font-size:10px;color:#a1a8b2}
.small-link{border:0;background:transparent;color:#657592;text-align:left;font-size:11px;padding:0;display:flex;justify-content:space-between}
.planner{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:19px 16px 14px;background:#fff}
.planner-toolbar{display:flex;align-items:center;justify-content:space-between;gap:11px;flex:none}
.date-nav{display:flex;align-items:center;gap:7px;min-width:0;position:relative}
.date-heading{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 7px;font-weight:700;font-size:17px;letter-spacing:-.5px;white-space:nowrap}
.date-heading:hover{color:#476ddd}
.chevron{font-size:12px;color:#989fac}
.today-button{border:1px solid var(--stroke);border-radius:8px;background:#fff;padding:7px 10px;font-size:11px;color:#666f7e}
#jumpDate{width:31px;max-width:31px;height:32px;border:1px solid var(--stroke);border-radius:8px;color:transparent;background:#fff;overflow:hidden;padding:4px}
#jumpDate::-webkit-calendar-picker-indicator{cursor:pointer;margin:0;opacity:.6}
.mode-picker{display:flex;gap:3px;padding:3px;border-radius:9px;background:#f3f4f7;border:1px solid #f0f1f4;flex:none}
.mode-picker button{border:0;background:transparent;color:#949aa4;padding:7px 12px;border-radius:7px;font-size:11px;font-weight:640}
.mode-picker button.active{background:#fff;color:#343945;box-shadow:0 1px 5px #1d2b4218}
.planner-caption{display:flex;align-items:center;justify-content:space-between;margin:13px 3px 12px;color:#a6acb4;font-size:11px;gap:10px;flex:none}
#weekProgress{color:#7c8997}
.board-viewport{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;overflow:hidden}
.day-column{min-width:0;display:flex;flex-direction:column;background:#fbfbfc;border:1px solid #eef0f3;border-radius:11px;overflow:hidden}
.day-column.today{background:#f8fbff;border-color:#a9c2fa}
.day-column.weekend{background:#fbfafb}
.day-heading{padding:13px 10px 11px;border-bottom:1px solid #eff0f3;display:flex;align-items:center;justify-content:space-between;gap:4px}
.day-name{font-size:11px;color:#707887;font-weight:630}
.day-name strong{font-weight:750;color:#30363e}
.day-name .today-number{background:#507dec;color:#fff;padding:2px 6px;border-radius:6px}
.day-estimate{color:#a3aab4;font-size:10px;white-space:nowrap}
.day-add{border:1px dashed #e5e8ed;background:#fff;color:#aaaeb7;margin:8px;border-radius:8px;min-height:32px;font-size:11px;flex:none;text-align:left;padding:0 8px}
.day-add:hover{border-color:#9db5f8;color:#4774dc}
.day-tasks{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 7px 10px}
.day-column.drop-target,.calendar-day.drop-target{background:#e9f1ff!important;border-color:#6a93f5}
.task-tile{display:flex;align-items:flex-start;gap:7px;margin:0 0 7px;background:#fff;border-radius:9px;border:1px solid #ededf1;padding:9px 7px;box-shadow:0 1px 4px #1f2b4006;min-height:61px;cursor:grab}
.task-tile:active{cursor:grabbing}
.task-tile .task-check{width:15px;height:15px;border:1.6px solid #cdd3db;border-radius:5px;background:#fff;flex:0 0 15px;padding:0;display:grid;place-items:center;line-height:1;font-size:11px}
.task-tile .task-check.done{background:#66be94;border-color:#66be94;color:#fff}
.task-tile .task-check.partial{border-color:#e7b45f;background:#fff9e7;color:#bd933c}
.task-tile .task-edit{flex:1;min-width:0;text-align:left;border:0;padding:0;background:transparent}
.task-tile .item-title{display:block;font-size:11px;line-height:1.35;overflow-wrap:anywhere}
.task-tile.done .item-title{color:#aaaeb4;text-decoration:line-through}
.task-tile .item-subline{font-size:10px;margin-top:7px;gap:5px;flex-wrap:wrap}
.task-tile .time-chip{margin-left:auto;color:#949ca5;font-size:10px;white-space:nowrap}
.task-tile .mini-actions{border:0;background:transparent;color:#b3bac1;font-size:15px;padding:0;flex:0 0 10px}
.task-tile.priority-high{border-left:2px solid #ed8698}
.task-tile.priority-low{border-left:2px solid #8bcbb3}
.calendar-viewport{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border:1px solid #eceef2;border-radius:10px;background:#fff}
.timeline-head{display:grid;grid-template-columns:44px repeat(7,minmax(95px,1fr));height:47px;position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--stroke);min-width:760px}
.timeline-head div{text-align:center;border-left:1px solid var(--stroke);padding:11px;font-size:11px}
.timeline-body{display:grid;grid-template-columns:44px repeat(7,minmax(95px,1fr));min-width:760px;height:1020px;position:relative}
.hour-labels{position:relative;background:#fff}
.hour-label{position:absolute;width:100%;text-align:center;color:#adb3bb;font-size:10px;transform:translateY(-5px)}
.calendar-day{position:relative;background:repeating-linear-gradient(to bottom,#fff 0px,#fff 59px,#ebedf1 59px,#ebedf1 60px);border-left:1px solid #edf0f3}
.time-block{position:absolute;left:4px;right:4px;padding:5px 7px;background:#b8d8ff;color:#2c547f;border-radius:6px;overflow:hidden;cursor:grab;font-size:10px;box-shadow:0 1px 3px #596d861e;line-height:1.35;z-index:1}
.time-block.work{background:#ffc6d1;color:#a94b67}
.time-block.study{background:#ddd0ff;color:#76569f}
.time-block.personal{background:#ffe2b2;color:#956726}
.time-block.sport{background:#bdf1d4;color:#407b60}
.time-block.health{background:#cce7ff;color:#4c78a4}
.time-block strong{display:block;font-weight:650;overflow-wrap:anywhere}
.time-block small{font-size:9px;opacity:.8}
.calendar-unscheduled{font-size:11px;color:#8f98a6;padding:9px 12px;border-top:1px solid var(--stroke);background:#f9fafc}
.focus-viewport{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,36%);gap:15px}
.focus-list,.focus-timer{min-width:0;min-height:0;border:1px solid var(--stroke);border-radius:13px;background:#fbfbfc;padding:18px}
.focus-list{overflow-y:auto;overscroll-behavior:contain}
.focus-list h2,.focus-timer h2{font-size:16px;letter-spacing:-.3px;margin:0 0 14px}
.focus-list .task-tile{max-width:700px}
.focus-list .focus-day-picker{margin-bottom:12px}
.focus-timer{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.timer-face{font-weight:710;font-size:clamp(39px,5vw,65px);font-variant-numeric:tabular-nums;letter-spacing:-2px}
.focus-timer p{color:#a0a7b2;font-size:12px}
.timer-actions{display:flex;gap:9px}
.primary-action{background:#373b45;border:1px solid #373b45;border-radius:8px;color:#fff;padding:9px 16px;font-weight:650}
.primary-action:hover{background:#1c2028}
.error-text{color:#bc4153;font-size:12px}
dialog{border:1px solid #e2e5eb;border-radius:15px;background:#fff;box-shadow:0 28px 90px #202b3a35;color:#2f3440;padding:0;max-height:min(90vh,850px)}
dialog::backdrop{background:#2027355e}
.editor-dialog{width:min(510px,calc(100vw - 30px))}
.panel-dialog{width:min(520px,calc(100vw - 30px))}
.dialog-header{display:flex;justify-content:space-between;align-items:center;padding:19px 22px;border-bottom:1px solid var(--stroke)}
.dialog-header h2{font-size:17px;letter-spacing:-.4px;margin:0}
.close-dialog{background:transparent;border:0;color:#9299a4;font-size:26px;line-height:1}
.editor-body{padding:18px 22px;display:grid;gap:13px;max-height:65vh;overflow-y:auto;overscroll-behavior:contain}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:12px}
.field>span{color:#666d78;font-size:11px;font-weight:600}
.field input,.field textarea,.field select{border:1px solid #e1e5eb;border-radius:8px;background:#fff;color:#313843;width:100%;min-width:0;padding:10px 11px;outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#789cfa}
.field textarea{resize:vertical}
.field-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.editor-advanced{border-top:1px solid var(--stroke);padding-top:12px}
.editor-advanced summary{cursor:pointer;color:#767f8d;font-size:12px}
.advanced-inner{display:grid;gap:11px;padding-top:14px}
.checkbox-line{display:flex;gap:9px;align-items:center;font-size:12px}
.dialog-footer{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 18px;border-top:1px solid var(--stroke)}
.footer-right{display:flex;gap:8px;margin-left:auto}
.delete-action{border:0;background:transparent;color:#cc6472}
.panel-content{max-height:70vh;overflow:auto;overscroll-behavior:contain;padding:19px 22px;display:grid;gap:14px}
.review-stat-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.review-stat-strip div,.metric-box{border-radius:10px;border:1px solid var(--stroke);background:#fafbfc;padding:13px}
.review-stat-strip strong,.metric-box strong{display:block;font-size:20px;margin-top:4px}
.review-stat-strip small,.metric-box small{font-size:11px;color:#98a0aa}
.review-bottom{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stats-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat-day{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:11px;border-bottom:1px solid var(--stroke);padding:9px 0}
.stat-bar{width:100%;height:6px;background:#eff1f4;border-radius:8px;margin:5px 0;overflow:hidden}
.stat-bar i{display:block;background:#7b9df5;height:100%;max-width:100%}
.template-row{border:1px solid var(--stroke);padding:10px;border-radius:8px;display:flex;align-items:center;gap:8px}
.template-row strong{flex:1;font-size:12px}
.template-row small{font-size:10px;color:var(--muted)}
.template-row button{background:#f5f7fa;border:1px solid var(--stroke);padding:7px;border-radius:7px}
.notification{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);z-index:30;background:#323a48;color:#fff;border-radius:9px;padding:10px 17px;box-shadow:0 12px 25px #101e3433;font-size:12px}
@media(max-width:1150px){.inbox-panel{width:235px;flex-basis:235px}.day-column .item-title{font-size:10px}.day-column{border-radius:8px}.board-viewport{gap:5px}.planner{padding-inline:9px}.day-heading{padding:10px 6px}}
@media(max-width:850px){.header-actions .quiet-action{display:none}.inbox-panel{width:208px;flex-basis:208px}.mode-picker button{padding:7px 8px}.task-tile{padding:7px 5px}.planner-toolbar{flex-wrap:wrap}.planner-caption{margin:8px 2px}.day-column .item-title{font-size:10px}}
@media(max-width:650px){.app-header{padding:0 9px;height:53px}.identity{font-size:13px}.inbox-panel{position:absolute;top:53px;bottom:0;left:0;z-index:13;width:min(85vw,290px)!important;flex-basis:auto!important;box-shadow:12px 0 24px #15203610}.workspace.inbox-hidden .inbox-panel{transform:translateX(-110%);opacity:0}.planner{padding:10px}.board-viewport{overflow-x:auto;grid-template-columns:repeat(7,minmax(160px,1fr));overscroll-behavior-x:contain}.mode-picker{margin-left:0}.date-heading{font-size:15px}.focus-viewport{grid-template-columns:1fr}.focus-timer{min-height:190px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

  </style>
</head>
<body>
<div class="workspace">
  <header class="app-header">
    <div class="identity">
      <span class="identity-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <strong>Задачи на неделю</strong>
    </div>
    <div class="header-actions">
      <button type="button" id="inboxToggle" class="icon-action" title="Показать или скрыть список без даты" aria-label="Панель задач">☰</button>
      <button type="button" id="openReview" class="quiet-action">Итоги дня</button>
      <button type="button" id="openStats" class="quiet-action">Аналитика</button>
      <details id="moreMenu" class="more-menu"><summary aria-label="Ещё действия">•••</summary>
        <div class="more-content">
          <button type="button" id="openTemplates">Шаблоны задач</button>
          <button type="button" id="exportButton">Экспорт JSON</button>
          <button type="button" id="importButton">Импорт JSON</button>
        </div>
      </details>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>
  <div class="work-area">
    <aside id="inboxPanel" class="inbox-panel">
      <div class="inbox-top"><div><span class="eyebrow">Собери мысли</span><h2>Список без даты <span id="inboxCount">0</span></h2></div><button id="newInboxTask" type="button" class="icon-action" aria-label="Добавить задачу без даты">+</button></div>
      <p class="inbox-caption">Записывай сейчас, планируй позже.</p>
      <form id="inboxForm" class="quick-add">
        <input id="inboxInput" maxlength="120" type="text" placeholder="Записать задачу..." aria-label="Новая задача без даты" required />
        <button type="submit" aria-label="Добавить">+</button>
      </form>
      <div id="inboxList" class="inbox-list" aria-live="polite"></div>
      <div class="inbox-bottom">
        <button type="button" id="openQuickTemplate" class="small-link">Шаблоны для повторения <span>↗</span></button>
        <span>Перетащи задачу на нужный день →</span>
      </div>
    </aside>
    <main class="planner">
      <div class="planner-toolbar">
        <div class="date-nav">
          <button type="button" class="icon-action" id="prevPeriod" aria-label="Предыдущая неделя">‹</button>
          <button type="button" class="date-heading" id="periodButton" title="Выбрать дату"><span id="periodTitle">Неделя</span><span class="chevron">⌄</span></button>
          <button type="button" class="icon-action" id="nextPeriod" aria-label="Следующая неделя">›</button>
          <button type="button" class="today-button" id="goToday">Сегодня</button>
          <input type="date" id="jumpDate" aria-label="Выбрать дату для перехода" />
        </div>
        <div class="mode-picker" role="group" aria-label="Режим просмотра">
          <button type="button" data-view="board" class="active">Задачи</button>
          <button type="button" data-view="calendar">Календарь</button>
          <button type="button" data-view="focus">Фокус</button>
        </div>
      </div>
      <div class="planner-caption"><span id="viewDescription">Распредели дела по дням недели</span><span id="weekProgress"></span></div>
      <div class="board-viewport" id="boardView" aria-label="Задачи недели"></div>
      <div class="calendar-viewport" id="calendarView" hidden></div>
      <div class="focus-viewport" id="focusView" hidden></div>
    </main>
  </div>
</div>

<dialog id="taskDialog" class="editor-dialog">
  <form id="taskForm" novalidate>
    <header class="dialog-header"><h2 id="taskDialogTitle">Новая задача</h2><button type="button" class="close-dialog" data-close="taskDialog" aria-label="Закрыть">×</button></header>
    <div class="editor-body">
      <label class="field"><span>Задача</span><input id="editTitle" type="text" maxlength="120" required placeholder="Что нужно сделать?" /></label>
      <div class="field-pair">
        <label class="field"><span>Дата</span><input id="editDate" type="date" /></label>
        <label class="field"><span>Список</span><select id="editCategory">
          <option value="work">Работа</option><option value="study">Учёба</option>
          <option value="personal">Личное</option><option value="sport">Спорт</option>
          <option value="health">Здоровье</option><option value="other">Другое</option>
        </select></label>
      </div>
      <div class="field-pair">
        <label class="field"><span>Оценка — часы</span><input id="editHours" type="number" min="0" max="744" step="1" placeholder="0" /></label>

<div id="notification" class="notification" hidden role="status"></div>
  <script>
const CATEGORIES = {
  work:'Работа', personal:'Личное время', study:'Учёба', sport:'Спорт', health:'Здоровье', other:'Другое'
};
const WEEKDAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DATE_PATTERN = /^\d{4}-\d{2}-\d{2}$/;
const TIME_PATTERN = /^([01]\d|2[0-3]):[0-5]\d$/;
const MAX_MINUTES = 1440 * 31;

function parseDate(iso) {
  if (typeof iso !== 'string' || !DATE_PATTERN.test(iso)) return null;
  const [y,m,d] = iso.split('-').map(Number);
  const date = new Date(y,m-1,d,12);
  if (date.getFullYear() !== y || date.getMonth() !== m-1 || date.getDate() !== d) return null;
  return date;
}
function toISO(date) {
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function addDays(iso, number) {
  const date = parseDate(iso);
  if (!date) throw new Error('Некорректная дата');
  date.setDate(date.getDate() + number);
  return toISO(date);
}
function startOfWeek(iso) {
  const d = parseDate(iso);
  if (!d) throw new Error('Некорректная дата');
  return addDays(iso,-((d.getDay()+6)%7));
}
function timeMinutes(time) {
  if (!TIME_PATTERN.test(time || '')) return NaN;
  const [h,m] = time.split(':').map(Number);
  return h*60+m;
}
function taskDuration(task) {
  if (Number.isInteger(task?.plannedMinutes)) return task.plannedMinutes;
  if (task?.start && task?.end) return Math.max(0,timeMinutes(task.end)-timeMinutes(task.start));
  return 0;
}
function minutesFromParts(hours,minutes) {
  const h=Number(hours || 0),m=Number(minutes || 0);
  if (!Number.isInteger(h) || !Number.isInteger(m) || h<0 || m<0 || h*60+m>MAX_MINUTES) return NaN;
  return h*60+m;
}
function formatMinutes(minutes) {
  const n=Math.max(0,Math.floor(Number(minutes)||0)),h=Math.floor(n/60),m=n%60;
  return h ? (m ? h+' ч '+m+' мин' : h+' ч') : m+' мин';
}
function formatDecimalHours(minutes) {
  return (Math.max(0,Number(minutes)||0)/60).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ч';
}
function validMinutes(value,optional=false) {
  return optional && value == null || Number.isInteger(value) && value>=0 && value<=MAX_MINUTES;
}
function validateTask(task) {
  if (!task || typeof task.title !== 'string' || !task.title.trim()) return 'Укажите название дела.';
  if (task.title.trim().length>120) return 'Название слишком длинное.';
  if (!parseDate(task.date)) return 'Выберите правильную дату.';
  if (task.start && Number.isNaN(timeMinutes(task.start))) return 'Укажите правильное время начала.';
  if (task.end && (Number.isNaN(timeMinutes(task.end)) || !task.start)) return 'Неверное время окончания.';
  if (task.start && task.end && timeMinutes(task.end)<=timeMinutes(task.start)) return 'Время окончания должно быть позже начала.';
  if (task.measureMode==='interval' && (!task.start || !task.end)) return 'Для интервала выберите время начала и окончания.';
  if (task.measureMode==='count' && (!Number.isInteger(task.targetCount) || task.targetCount<1 || task.targetCount>100000)) return 'Укажите количество повторений от 1 до 100000.';
  if (task.actualCount!=null && (!Number.isInteger(task.actualCount) || task.actualCount<0 || task.actualCount>100000)) return 'Укажите корректное количество выполненных повторений.';
  if (task.measureMode && !['duration','interval','count'].includes(task.measureMode)) return 'Выберите способ планирования.';
  if (task.status && !['todo','partial','done'].includes(task.status)) return 'Укажите корректный статус.';
  if (!validMinutes(task.plannedMinutes,true)) return 'Плановое время должно быть целым числом минут.';
  if (!validMinutes(task.actualMinutes,true)) return 'Фактическое время должно быть целым числом минут.';
  if (!Object.hasOwn(CATEGORIES,task.category)) return 'Выберите категорию.';
  if (!['low','normal','high'].includes(task.priority)) return 'Выберите важность.';
  if (!['none','daily','weekly'].includes(task.repeat)) return 'Выберите повторение.';
  if (typeof task.notes!=='string' || task.notes.length>5000) return 'Комментарий слишком длинный.';
  return null;
}
function occurrencesForWeek(tasks,monday) {
  const sunday=addDays(monday,6),results=[];
  for(const task of tasks) {
    if(task.repeat==='weekly' || task.repeat==='daily') {
      const dates=task.repeat==='daily'
        ?Array.from({length:7},(_,i)=>addDays(monday,i))
        :[addDays(monday,(parseDate(task.date).getDay()+6)%7)];
      for(const date of dates) {
        if(date<task.date)continue;
        const status=task.statusByDate?.[date] ?? ((task.completedDates||[]).includes(date)?'done':'todo');
        results.push({...task,occurrenceDate:date,status,done:status==='done',
          actualMinutes:task.actualByDate?.[date]??null,
          actualCount:task.actualCountByDate?.[date]??null});
      }
    } else if(task.date>=monday && task.date<=sunday) {
      const status=task.status??(task.completed?'done':'todo');
      results.push({...task,occurrenceDate:task.date,status,done:status==='done'});
    }
  }
  return results.sort((a,b)=>a.occurrenceDate.localeCompare(b.occurrenceDate)
    || (a.start||'').localeCompare(b.start||'') || a.title.localeCompare(b.title));
}
function weekStats(occurrences) {
  const total=occurrences.length,done=occurrences.filter(t=>t.done).length;
  const minutes=occurrences.reduce((sum,t)=>sum+Math.max(0,taskDuration(t)),0);
  return {total,done,minutes,percent:total?Math.round(100*done/total):0};
}
function timeStats(occurrences) {
  const plan=occurrences.reduce((sum,t)=>sum+taskDuration(t),0);
  const fact=occurrences.reduce((sum,t)=>sum+(Number.isInteger(t.actualMinutes)?t.actualMinutes:0),0);
  const measured=occurrences.filter(t=>Number.isInteger(t.actualMinutes)).length;
  const done=occurrences.filter(t=>t.done).length;
  const partial=occurrences.filter(t=>t.status==='partial').length;
  const countPlan=occurrences.reduce((sum,t)=>sum+(t.measureMode==='count'?t.targetCount||0:0),0);
  const countFact=occurrences.reduce((sum,t)=>sum+(t.measureMode==='count'?t.actualCount||0:0),0);
  const countMeasured=occurrences.filter(t=>t.measureMode==='count'&&Number.isInteger(t.actualCount)).length;
  return {plan,fact,measured,total:occurrences.length,done,partial,countPlan,countFact,countMeasured,
    completion:occurrences.length?Math.round((done+partial*0.5)/occurrences.length*100):0,
    timeRatio:plan>0&&measured>0?Math.round(fact/plan*100):null};
}
function createFromTemplate(template,date,id) {
  return {id,title:template.title,date,start:'',end:'',plannedMinutes:template.plannedMinutes??0,
    actualMinutes:null,actualByDate:{},category:template.category||'other',
    priority:template.priority||'normal',repeat:'none',notes:template.notes||'',completed:false,
    status:'todo',statusByDate:{},completedDates:[],measureMode:template.measureMode||'duration',
    targetCount:template.targetCount??null,actualCount:null,actualCountByDate:{}};
}
function plainNotesMap(value) {
  if (!value || typeof value!=='object' || Array.isArray(value)) return {};
  return Object.fromEntries(Object.entries(value)
    .filter(([key,val])=>parseDate(key)&&typeof val==='string')
    .map(([key,val])=>[key,val.slice(0,10000)]));
}
function sanitizedActualByDate(value) {
  if(!value || typeof value!=='object' || Array.isArray(value)) return {};
  return Object.fromEntries(Object.entries(value)
    .filter(([date,minutes])=>parseDate(date)&&validMinutes(minutes)).slice(-520));
}
function sanitizeTemplate(template,index,ids) {
  const t={id:typeof template?.id==='string'&&template.id.length<150&&template.id&&!ids.has(template.id)
      ?template.id:'template-'+index+'-'+Date.now(),
    title:typeof template?.title==='string'?template.title.trim().slice(0,120):'',
    notes:typeof template?.notes==='string'?template.notes.slice(0,5000):'',
    plannedMinutes: template?.plannedMinutes??0,measureMode:template?.measureMode||'duration',
    targetCount:template?.targetCount??null,
    category:template?.category||'other',priority:template?.priority||'normal'};
  if(!t.title || !validMinutes(t.plannedMinutes) || !Object.hasOwn(CATEGORIES,t.category)
    || !['low','normal','high'].includes(t.priority)
    || (t.measureMode==='count'&&(!Number.isInteger(t.targetCount)||t.targetCount<1||t.targetCount>100000))) throw new Error('Некорректное дело из общего списка.');
  ids.add(t.id);return t;
}
function sanitizeStatusByDate(value) {
  if(!value || typeof value!=='object' || Array.isArray(value))return {};
  return Object.fromEntries(Object.entries(value).filter(([date,status])=>
    parseDate(date)&&['todo','partial','done'].includes(status)).slice(-520));
}
function sanitizeCountByDate(value) {
  if(!value || typeof value!=='object' || Array.isArray(value))return {};
  return Object.fromEntries(Object.entries(value).filter(([date,count])=>
    parseDate(date)&&Number.isInteger(count)&&count>=0&&count<=100000).slice(-520));
}
function sanitizeInbox(value) {
  if(!Array.isArray(value))return [];
  if(value.length>3000)throw new Error('Слишком много дел без даты.');
  const ids=new Set();
  return value.map((item,i)=>{
    const title=typeof item?.title==='string'?item.title.trim().slice(0,120):'';
    const plannedMinutes=item?.plannedMinutes??0;
    const category=Object.hasOwn(CATEGORIES,item?.category)?item.category:'personal';
    const priority=['low','normal','high'].includes(item?.priority)?item.priority:'normal';
    if(!title || !validMinutes(plannedMinutes))throw new Error('Некорректное дело без даты.');
    let id=typeof item?.id==='string' && item.id.length<150?item.id:'';
    if(!id||ids.has(id))id='inbox-'+i+'-'+Date.now();
    ids.add(id);
    return {id,title,plannedMinutes,category,priority,
      notes:typeof item?.notes==='string'?item.notes.slice(0,5000):''};
  });
}
function sanitizeReviews(value) {
  if(!value || typeof value!=='object' || Array.isArray(value))return {};
  return Object.fromEntries(Object.entries(value).filter(([day,v])=>parseDate(day)&&
    typeof v==='string').slice(-1200).map(([day,v])=>[day,v.slice(0,5000)]));
}
function sanitizeBackup(value) {
  if(!value || typeof value!=='object' || value.version!==1
    || !Array.isArray(value.tasks) || value.tasks.length>10000) throw new Error('Неизвестный формат резервной копии.');
  const ids=new Set();
  const tasks=value.tasks.map((task,index)=>{
    const start=typeof task?.start==='string'?task.start:'';
    const end=typeof task?.end==='string'?task.end:'';
    const legacyMinutes=start && end && !Number.isNaN(timeMinutes(start)) && !Number.isNaN(timeMinutes(end))
      ?Math.max(0,timeMinutes(end)-timeMinutes(start)):0;
    const t={
      id:typeof task?.id==='string'&&task.id.length<150&&task.id&&!ids.has(task.id)?task.id:'imported-'+index+'-'+Date.now(),
      title:typeof task?.title==='string'?task.title.slice(0,121).trim():'',
      date:task?.date,start,end,plannedMinutes:task?.plannedMinutes??legacyMinutes,
      actualMinutes:task?.actualMinutes??null,actualByDate:sanitizedActualByDate(task?.actualByDate),
      measureMode:task?.measureMode??(start&&end?'interval':'duration'),
      targetCount:task?.targetCount??null,actualCount:task?.actualCount??null,
      actualCountByDate:sanitizeCountByDate(task?.actualCountByDate),
      category:task?.category,priority:task?.priority,repeat:task?.repeat,
      notes:typeof task?.notes==='string'?task.notes:'',
      completed:task?.completed===true,status:task?.status??(task?.completed===true?'done':'todo'),
      statusByDate:sanitizeStatusByDate(task?.statusByDate),
      completedDates:Array.isArray(task?.completedDates)
        ?[...new Set(task.completedDates.filter(date=>parseDate(date)))].slice(-520):[]
    };
    ids.add(t.id);
    const error=validateTask(t);
    if(error) throw new Error('Дело №'+(index+1)+': '+error);
    return t;
  });
  const rawTemplates=Array.isArray(value.templates)?value.templates:[];
  if(rawTemplates.length>2000)throw new Error('Слишком много дел в общем списке.');
  const templateIDs=new Set();
  const templates=rawTemplates.map((t,i)=>sanitizeTemplate(t,i,templateIDs));
  return {version:1,tasks,templates,inbox:sanitizeInbox(value.inbox),
    reviews:sanitizeReviews(value.reviews),dayNotes:plainNotesMap(value.dayNotes),
    weekNotes:plainNotesMap(value.weekNotes),theme:'dark'};
}
function blankData() {
  return {version:1,tasks:[],templates:[],inbox:[],reviews:{},dayNotes:{},weekNotes:{},theme:'dark'};
}


const KEY='nedelnik-planner-v1';
const $=id=>document.getElementById(id);
const today=()=>toISO(new Date());
const shortDays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const escapeHTML=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'task-'+Date.now()+'-'+Math.random().toString(36).slice(2);
let state=load(),week=startOfWeek(today()),focusedDay=today(),view='board',editor=null;
let dragItem=null,toastTimeout=null,focusRemaining=25*60,focusRunning=false,focusEndsAt=0,timerHandle=null;

function load() {
  try {
    const str=localStorage.getItem(KEY);
    return str?sanitizeBackup(JSON.parse(str)):blankData();
  }catch(error){
    console.error('Saved data cannot be read',error);
    return blankData();
  }
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(error){notify('Не удалось сохранить: используйте экспорт JSON');console.error(error);}
}
function notify(text){
  clearTimeout(toastTimeout);
  $('notification').textContent=text;$('notification').hidden=false;
  toastTimeout=setTimeout(()=>$('notification').hidden=true,3500);
}
function closeDialog(id){if($(id).open)$(id).close();}
function openDialog(id){$('moreMenu').open=false;$(id).showModal();}
function weekLabel(iso){
  const last=addDays(iso,6),a=parseDate(iso),b=parseDate(last);
  const m=d=>d.toLocaleDateString('ru-RU',{month:'long'});
  return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()
    ?a.getDate()+'–'+b.getDate()+' '+m(b)+' '+b.getFullYear()
    :a.getDate()+' '+m(a)+' – '+b.getDate()+' '+m(b)+' '+b.getFullYear();
}
function dayLabel(iso){return parseDate(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function allTasks(){return occurrencesForWeek(state.tasks,week);}
function dayTasks(iso){return allTasks().filter(t=>t.occurrenceDate===iso);}
function statusOf(task,date){
  return task.repeat==='daily'||task.repeat==='weekly'
    ?(task.statusByDate?.[date]??((task.completedDates||[]).includes(date)?'done':'todo'))
    :(task.status??(task.completed?'done':'todo'));
}
function planned(task){return Number.isInteger(task.plannedMinutes)?task.plannedMinutes:taskDuration(task);}
function duration(estimate){return estimate>0?formatMinutes(estimate):'Без оценки';}
function dot(category){return '<span class="category-dot '+escapeHTML(category||'other')+'"></span>';}
function renderInbox(){
  $('inboxCount').textContent=state.inbox.length;
  $('inboxList').innerHTML=state.inbox.length?state.inbox.map(t=>
    '<article class="inbox-item" draggable="true" data-source="inbox" data-id="'+escapeHTML(t.id)+'">'

    +'<div class="item-main"><div class="item-title">'+escapeHTML(t.title)+'</div>'
    +'<div class="item-subline">'+dot(t.category)+escapeHTML(CATEGORIES[t.category]||'Личное')+' · '+duration(planned(t))+'</div></div>'
    +'<button type="button" data-action="inbox-today" data-id="'+escapeHTML(t.id)+'" title="Запланировать на сегодня">→</button>'
    +'</article>').join('')
    :'<p class="inbox-empty">Здесь живут дела без даты.<br>Добавь мысль — затем перетащи её в расписание.</p>';
}
function card(t,day){
  const status=statusOf(t,day),done=status==='done';
  const estimate=planned(t),sub=[dot(t.category),escapeHTML(CATEGORIES[t.category]||'Другое')];
  if(t.start)sub.push('· '+escapeHTML(t.start));
  const meta=sub.join('');
  return '<article class="task-tile '+(done?'done ':'')+'priority-'+escapeHTML(t.priority||'normal')
    +'" data-source="task" draggable="true" data-id="'+escapeHTML(t.id)+'" data-date="'+day+'">'
    +'<button type="button" class="task-check '+(done?'done':status==='partial'?'partial':'')
    +'" data-action="status" data-id="'+escapeHTML(t.id)+'" data-date="'+day
    +'" aria-label="Изменить статус: '+escapeHTML(t.title)+'">'+(done?'✓':status==='partial'?'−':'')+'</button>'
    +'<button type="button" class="task-edit" data-action="edit-task" data-id="'+escapeHTML(t.id)+'" data-date="'+day+'">'
    +'<span class="item-title">'+escapeHTML(t.title)+'</span><span class="item-subline">'+meta+'</span></button>'
    +(estimate>0?'<span class="time-chip">'+formatMinutes(estimate)+'</span>':'')
    +'</article>';
}
function renderBoard(){
  const all=allTasks();
  $('boardView').innerHTML=Array.from({length:7},(_,i)=>{
    const date=addDays(week,i),tasks=all.filter(t=>t.occurrenceDate===date),now=date===today();
    const estimate=tasks.reduce((sum,t)=>sum+planned(t),0);
    return '<section class="day-column '+(now?'today ':'')+(i>=5?'weekend':'')
      +'" data-drop-date="'+date+'" aria-label="'+WEEKDAYS[i]+' '+dayLabel(date)+'">'
      +'<div class="day-heading"><span class="day-name"><strong class="'+(now?'today-number':'')+'">'
      +shortDays[i]+' '+parseDate(date).getDate()+'</strong></span><span class="day-estimate">'
      +(estimate?formatMinutes(estimate):'')+'</span></div>'
      +'<button type="button" class="day-add" data-action="add-day" data-date="'+date+'">＋ Добавить задачу</button>'
      +'<div class="day-tasks">'+tasks.map(t=>card(t,date)).join('')+'</div></section>';
  }).join('');
}
function renderCalendar(){
  const tasks=allTasks(),startHour=6,endHour=23;
  const head='<div class="timeline-head"><span></span>'
    +Array.from({length:7},(_,i)=>'<div>'+shortDays[i]+' '+parseDate(addDays(week,i)).getDate()+'</div>').join('')
    +'</div>';
  const labels='<div class="hour-labels">'+Array.from({length:endHour-startHour+1},(_,i)=>
    '<span class="hour-label" style="top:'+(i*60)+'px">'+String(i+startHour).padStart(2,'0')+':00</span>').join('')+'</div>';
  const columns=Array.from({length:7},(_,i)=>{
    const date=addDays(week,i);

      const start=timeMinutes(t.start);if(Number.isNaN(start))return '';
      const mins=planned(t)>0?planned(t):60;
      const top=Math.max(0,start-startHour*60);
      if(top>(endHour-startHour)*60)return '';
      const ht=Math.min((endHour-startHour)*60-top,Math.max(25,mins));
      return '<div class="time-block '+escapeHTML(t.category)+'" draggable="true" data-source="task" data-id="'
        +escapeHTML(t.id)+'" data-date="'+date+'" style="top:'+top+'px;height:'+ht
        +'px" title="'+escapeHTML(t.title)+'"><strong>'+escapeHTML(t.title)
        +'</strong><small>'+escapeHTML(t.start)+(t.end?'–'+escapeHTML(t.end):' · '+formatMinutes(mins))+'</small></div>';
    }).join('')+'</div>';

function defaultTask(title,date){
  return {id:uid(),title,date,start:'',end:'',plannedMinutes:30,actualMinutes:null,actualByDate:{},
    category:'personal',priority:'normal',repeat:'none',notes:'',completed:false,completedDates:[],
    status:'todo',statusByDate:{},measureMode:'duration',targetCount:null,actualCount:null,actualCountByDate:{}};
}
function inboxFromTask(task){
  return {id:uid(),title:task.title,category:task.category||'personal',priority:task.priority||'normal',
    plannedMinutes:planned(task),notes:task.notes||''};
}
function captureInbox(title){
  if(!title.trim())return;
  if(state.inbox.length>=3000){notify('Достигнут лимит списка без даты');return;}
  state.inbox.push({id:uid(),title:title.trim().slice(0,120),plannedMinutes:30,
    category:'personal',priority:'normal',notes:''});
  save();render();
}
function addInboxToDay(id,date,atMinutes=null){
  const idx=state.inbox.findIndex(t=>t.id===id);if(idx===-1)return;
  const t=state.inbox[idx];
  const task={...defaultTask(t.title,date),plannedMinutes:t.plannedMinutes,
    category:t.category,priority:t.priority,notes:t.notes};
  if(Number.isFinite(atMinutes))applyTime(task,atMinutes);
  const error=validateTask(task);if(error){notify(error);return;}
  state.tasks.push(task);state.inbox.splice(idx,1);save();render();
}
function applyTime(task,minutes){
  const start=Math.round(minutes/15)*15;
  const duration=Math.min(Math.max(planned(task),15),1439-start);
  const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
  task.start=fmt(start);task.end=fmt(start+duration);
  task.plannedMinutes=duration;task.measureMode='interval';
}
function moveTask(id,fromDate,toDate,atMinutes=null){
  const task=state.tasks.find(t=>t.id===id);if(!task)return;
  if(task.repeat!=='none') {
    const original=occurrencesForWeek([task],startOfWeek(fromDate)).find(t=>t.occurrenceDate===fromDate);
    if(!original)return;
    const copy={...defaultTask(original.title,toDate),category:original.category,
      priority:original.priority,notes:original.notes,plannedMinutes:planned(original)};
    if(Number.isFinite(atMinutes))applyTime(copy,atMinutes);
    state.tasks.push(copy);
    notify('Повторяющаяся задача скопирована на выбранный день');
  }else{
    task.date=toDate;
    if(Number.isFinite(atMinutes))applyTime(task,atMinutes);
  }
  save();render();
}
function moveToInbox(id){
  const idx=state.tasks.findIndex(t=>t.id===id);if(idx===-1)return;
  const task=state.tasks[idx];
  state.inbox.push(inboxFromTask(task));
  if(task.repeat==='none')state.tasks.splice(idx,1);
  save();render();notify('Задача перемещена в список без даты');
}
function changeStatus(id,date){
  const t=state.tasks.find(task=>task.id===id);if(!t)return;
  const next=statusOf(t,date)==='done'?'todo':'done';
  if(t.repeat!=='none'){
    t.statusByDate={...(t.statusByDate||{}),[date]:next};
    const done=new Set(t.completedDates||[]);
    if(next==='done')done.add(date);else done.delete(date);
    t.completedDates=[...done].sort();
  }else{t.status=next;t.completed=next==='done';}
  save();render();
}
function chooseDate(date){
  if(!parseDate(date))return;
  week=startOfWeek(date);focusedDay=date;render();
}
function openEditor(source='new',id=null,occurrence=null,date=null,atMinutes=null){
  editor={source,id,occurrence,date};$('taskForm').reset();$('editError').hidden=true;
  const task=source==='task'?state.tasks.find(t=>t.id===id):
    source==='inbox'?state.inbox.find(t=>t.id===id):null;
  $('taskDialogTitle').textContent=source==='new'?'Новая задача':'Редактирование задачи';
  $('editTitle').value=task?.title||'';
  $('editDate').value=source==='inbox'?'':(task?.repeat!=='none'&&occurrence?occurrence:task?.date||date||focusedDay);
  $('editCategory').value=task?.category||'personal';
  $('editPriority').value=task?.priority||'normal';
  const mins=task?planned(task):30;
  $('editHours').value=Math.floor(mins/60);
  $('editMinutes').value=mins%60;
  $('editStart').value=task?.start||'';
  $('editEnd').value=task?.end||'';
  if(Number.isFinite(atMinutes)){
    const tmp=defaultTask('x',date||focusedDay);
    applyTime(tmp,atMinutes);
    $('editStart').value=tmp.start;$('editEnd').value=tmp.end;
  }
  $('editRepeat').value=task?.repeat||'none';
  $('editStatus').value=task&&source==='task'?statusOf(task,occurrence||task.date):'todo';
  const actualValue=source==='task'&&task
    ?(task.repeat!=='none'?task.actualByDate?.[occurrence||task.date]:task.actualMinutes)
    :null;
  $('editActual').value=actualValue??'';
  $('editNotes').value=task?.notes||'';
  $('deleteTask').hidden=source==='new';
  $('saveTemplate').checked=false;
  openDialog('taskDialog');$('editTitle').focus();
}
function submitEditor(event){
  event.preventDefault();
  const title=$('editTitle').value.trim(),date=$('editDate').value;
  const minutes=minutesFromParts($('editHours').value,$('editMinutes').value);
  const actual=$('editActual').value===''?null:Number($('editActual').value);
  if(!title||Number.isNaN(minutes)){showEditError('Введите название и правильное время.');return;}
  const fields={title:title.slice(0,120),date,start:$('editStart').value,end:$('editEnd').value,
    plannedMinutes:minutes,actualMinutes:actual,category:$('editCategory').value,
    priority:$('editPriority').value,repeat:$('editRepeat').value,
    status:$('editStatus').value,notes:$('editNotes').value.trim()};
  if(fields.start && !fields.end){
    const start=timeMinutes(fields.start);
    const end=Math.min(1439,start+Math.max(15,minutes));
    fields.end=String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0');
  }
  if(!fields.start)fields.end='';
  if(fields.start&&fields.end)fields.plannedMinutes=timeMinutes(fields.end)-timeMinutes(fields.start);
  if(!date) {
    if(fields.repeat!=='none'){showEditError('Для повторения укажите дату начала.');return;}
    if(editor.source==='task'){
      const index=state.tasks.findIndex(t=>t.id===editor.id);
      if(index>=0)state.tasks.splice(index,1);
    }
    const existing=editor.source==='inbox'?state.inbox.find(t=>t.id===editor.id):null;
    const newInbox={id:existing?.id||uid(),title:fields.title,plannedMinutes:minutes,
      category:fields.category,priority:fields.priority,notes:fields.notes};
    if(existing)Object.assign(existing,newInbox);else state.inbox.push(newInbox);
  }else{
    const old=editor.source==='task'?state.tasks.find(t=>t.id===editor.id):null;
    const candidate={...(old||defaultTask(fields.title,date)),...fields,
      measureMode:fields.start?'interval':'duration'};
    if(old?.repeat!=='none' && fields.repeat!=='none' && date===(editor.occurrence||old.date)){
      // Editing an occurrence preserves the series' original anchor date.
      candidate.date=old.date;
    }
    const err=validateTask(candidate);
    if(err){showEditError(err);return;}
    const day=editor.occurrence||date;
    if(candidate.repeat!=='none'){
      candidate.statusByDate={...(old?.statusByDate||{}),[day]:fields.status};
      candidate.actualByDate={...(old?.actualByDate||{})};
      if(actual!==null)candidate.actualByDate[day]=actual;
      else delete candidate.actualByDate[day];
      const done=new Set(old?.completedDates||[]);
      if(fields.status==='done')done.add(day);else done.delete(day);
      candidate.completedDates=[...done].sort();
      candidate.actualMinutes=null;candidate.completed=false;
    }else{
      candidate.statusByDate={};candidate.completedDates=[];candidate.actualByDate={};
      candidate.completed=fields.status==='done';
    }
    if(old)Object.assign(old,candidate);
    else {
      state.tasks.push(candidate);
      if(editor.source==='inbox')state.inbox=state.inbox.filter(x=>x.id!==editor.id);
    }
  }
  if($('saveTemplate').checked && !state.templates.some(t=>t.title===fields.title)){
    state.templates.push({id:uid(),title:fields.title,plannedMinutes:minutes,
      category:fields.category,priority:fields.priority,notes:fields.notes});
  }
  closeDialog('taskDialog');save();render();notify('Задача сохранена');
}
function showEditError(error){$('editError').textContent=error;$('editError').hidden=false;}
function deleteEditor(){
  if(!editor)return;
  const task=editor.source==='task'?state.tasks.find(t=>t.id===editor.id):null;
  if(task?.repeat!=='none' && task?.repeat && !confirm('Удалить всю повторяющуюся серию задач?'))return;
  if(editor.source==='inbox')state.inbox=state.inbox.filter(t=>t.id!==editor.id);
  else if(editor.source==='task')state.tasks=state.tasks.filter(t=>t.id!==editor.id);
  closeDialog('taskDialog');save();render();notify('Задача удалена');
}
function reviewSummary(){
  const date=$('reviewDate').value;if(!parseDate(date))return;
  const tasks=occurrencesForWeek(state.tasks,startOfWeek(date)).filter(t=>t.occurrenceDate===date);
  const done=tasks.filter(t=>t.done).length;
  const plan=tasks.reduce((n,t)=>n+planned(t),0);
  const fact=tasks.reduce((n,t)=>n+(t.actualMinutes||0),0);
  $('reviewStats').innerHTML=[
    ['Выполнено',done+' / '+tasks.length],['План',formatMinutes(plan)],['Факт',formatMinutes(fact)]
  ].map(([name,n])=>'<div><small>'+name+'</small><strong>'+n+'</strong></div>').join('');
  $('reviewNotes').value=state.reviews[date]||'';
}

function saveReview(){

}
function rollTomorrow(){
  const date=$('reviewDate').value;if(!parseDate(date))return;
  const tomorrow=addDays(date,1);
  const tasks=state.tasks.filter(t=>t.repeat==='none'&&t.date===date&&statusOf(t,date)!=='done');
  if(!tasks.length){notify('Нет незавершённых задач для переноса');return;}
  if(!confirm('Перенести '+tasks.length+' незавершённых задач на '+dayLabel(tomorrow)+'?'))return;
  tasks.forEach(t=>t.date=tomorrow);
  save();reviewSummary();render();notify('Незавершённые дела перенесены');
}

async function importData(file){
  if(!file)return;
  try{
    if(file.size>5_000_000)throw Error('Файл больше 5 МБ.');
    const decoded=sanitizeBackup(JSON.parse(await file.text()));
    if(!confirm('Заменить текущие задачи данными из файла? Сначала сохраните резервную копию.'))return;
    state=decoded;save();render();notify('Данные импортированы');
  }catch(err){notify('Ошибка импорта: '+err.message);}
  finally{$('importFile').value='';}
}
function refreshTimer(){
  if(!$('timerFace'))return;
  const s=focusRemaining;
  $('timerFace').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function timerTick(){
  if(!focusRunning)return;
  focusRemaining=Math.max(0,Math.ceil((focusEndsAt-Date.now())/1000));
  refreshTimer();
  if(focusRemaining===0){focusRunning=false;clearInterval(timerHandle);
    if($('timerToggle'))$('timerToggle').textContent='Начать';
    notify('Сессия фокуса завершена');}
}
function toggleTimer(){
  if(focusRunning){focusRemaining=Math.max(0,Math.ceil((focusEndsAt-Date.now())/1000));focusRunning=false;clearInterval(timerHandle);}
  else{if(focusRemaining<=0)focusRemaining=25*60;focusEndsAt=Date.now()+focusRemaining*1000;
    focusRunning=true;timerHandle=setInterval(timerTick,500);}
  if($('timerToggle'))$('timerToggle').textContent=focusRunning?'Пауза':'Начать';
  refreshTimer();
}
function resetTimer(){focusRunning=false;clearInterval(timerHandle);focusRemaining=25*60;
  if($('timerToggle'))$('timerToggle').textContent='Начать';refreshTimer();}
function setupDrag(){
  document.addEventListener('dragstart',event=>{
    const item=event.target.closest('[draggable=true][data-id]');if(!item)return;
    dragItem={source:item.dataset.source,id:item.dataset.id,date:item.dataset.date||null};
    event.dataTransfer.effectAllowed='move';
    event.dataTransfer.setData('text/plain',JSON.stringify(dragItem));
    item.classList.add('dragging');
  });
  document.addEventListener('dragend',event=>{
    event.target.closest('.dragging')?.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(t=>t.classList.remove('drop-target'));
    dragItem=null;
  });
  document.addEventListener('dragover',event=>{
    const target=event.target.closest('[data-drop-date],.inbox-panel');
    if(!target)return;
    event.preventDefault();event.dataTransfer.dropEffect='move';
    document.querySelectorAll('.drop-target').forEach(t=>t.classList.remove('drop-target'));
    target.classList.add('drop-target');
  });
  document.addEventListener('drop',event=>{
    const target=event.target.closest('[data-drop-date],.inbox-panel');
    if(!target)return;
    event.preventDefault();
    const item=dragItem;if(!item)return;
    document.querySelectorAll('.drop-target').forEach(t=>t.classList.remove('drop-target'));
    if(target.matches('.inbox-panel')){
      if(item.source==='task')moveToInbox(item.id);
      return;
    }
    let at=null;
    if(target.classList.contains('calendar-day')){
      const rect=target.getBoundingClientRect();
      const y=event.clientY-rect.top;
      at=Math.round((360+Math.max(0,y))/15)*15;
      at=Math.max(360,Math.min(1350,at));
    }
    const date=target.dataset.dropDate;
    if(item.source==='inbox')addInboxToDay(item.id,date,at);
    else moveTask(item.id,item.date,date,at);
  });
}
function setupClick(){
  document.addEventListener('click',event=>{
    const action=event.target.closest('[data-action]');if(action){
      const {action:verb,id,date}=action.dataset;
      if(verb==='add-day')openEditor('new',null,null,date);
      else if(verb==='status')changeStatus(id,date);
      else if(verb==='edit-task')openEditor('task',id,date);
      else if(verb==='edit-inbox')openEditor('inbox',id);
      else if(verb==='inbox-today')addInboxToDay(id,today());
      return;
    }
    if(event.target.closest('[data-close]'))closeDialog(event.target.closest('[data-close]').dataset.close);
    if(event.target.closest('[data-template]')){
      const tpl=state.templates.find(t=>t.id===event.target.closest('[data-template]').dataset.template);
      if(tpl){state.inbox.push({id:uid(),title:tpl.title,plannedMinutes:tpl.plannedMinutes,
        category:tpl.category,priority:tpl.priority,notes:tpl.notes});save();render();
        closeDialog('templateDialog');notify('Шаблон добавлен в список');}
    }
    if(event.target.id==='timerToggle')toggleTimer();
    if(event.target.id==='timerReset')resetTimer();
    const blankDay=event.target.closest('.day-column');
    if(blankDay && !event.target.closest('.task-tile,.day-add,.day-heading,button,input')){
      openEditor('new',null,null,blankDay.dataset.dropDate);
      return;
    }
    if(event.target.closest('.calendar-day')&&event.target===event.target.closest('.calendar-day')){
      const target=event.target;
      const mins=Math.round((360+event.clientY-target.getBoundingClientRect().top)/15)*15;
      openEditor('new',null,null,target.dataset.dropDate,Math.max(360,Math.min(1350,mins)));
    }
  });
}

  }
  document.addEventListener('keydown',event=>{
    if(event.target.matches('input,textarea,select')||event.ctrlKey||event.altKey||event.metaKey)return;
    if(event.key.toLowerCase()==='n'){event.preventDefault();$('inboxInput').focus();}
  });
  setupDrag();setupClick();
  render();
}
setup();

  </script>
</body>
</html>
