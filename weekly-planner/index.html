<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafaf9" />
  <meta name="description" content="Недельник — спокойный планировщик дел по дням недели." />
  <title>Недельник — список недели</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <main class="main-content">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Недельник — главная">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span>Недельник<span class="brand-period">.</span></span>
        </a>
        <div class="topbar-actions">
          <button class="primary-button" id="newTaskButton" type="button"><span aria-hidden="true">+</span> Новое дело</button>
          <details class="more-menu" id="moreMenu">
            <summary aria-label="Дополнительные действия" title="Дополнительные действия">···</summary>
            <div class="menu-panel">
              <button id="filtersToggle" type="button" aria-expanded="false">Поиск и фильтры</button>
              <button id="themeToggle" type="button">Тёмная тема</button>
              <div class="menu-divider"></div>
              <button id="exportButton" type="button">Экспорт данных</button>
              <button id="importButton" type="button">Импорт данных</button>
            </div>
          </details>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
        </div>
      </header>

      <section class="week-section" aria-labelledby="weekTitle">
        <div class="week-controls">
          <div class="week-title-group"><p class="section-kicker">Моя неделя</p><h1 id="weekTitle">Неделя</h1></div>
          <div class="week-arrows">
            <button class="arrow-button" id="previousWeek" aria-label="Предыдущая неделя" type="button">←</button>
            <button class="today-button" id="goToday" type="button">Сегодня</button>
            <button class="arrow-button" id="nextWeek" aria-label="Следующая неделя" type="button">→</button>
          </div>
        </div>

        <div class="filters-panel" id="filtersPanel" hidden>
          <label class="searchbox"><span aria-hidden="true">⌕</span><input type="search" id="searchInput" placeholder="Найти дело..." aria-label="Поиск по делам" /></label>
          <select id="categoryFilter" aria-label="Фильтр по категории">
            <option value="all">Все категории</option><option value="work">Работа</option><option value="personal">Личное</option><option value="study">Учёба</option><option value="health">Здоровье</option><option value="other">Другое</option>
          </select>
          <label class="completed-filter"><input type="checkbox" id="hideCompleted" /> Скрыть выполненные</label>
        </div>
        <div class="week-list" id="weekBoard" aria-live="polite"></div>
      </section>

      <details class="week-notes-section">
        <summary>Заметка к неделе</summary>
        <div class="week-note-input"><textarea id="weekNote" rows="3" maxlength="10000" placeholder="Что важно помнить на этой неделе?" aria-label="Заметка к неделе"></textarea><span class="autosave-note" id="saveStatus">Сохраняется автоматически</span></div>
      </details>
    </main>
  </div>

  <dialog id="taskDialog" class="task-dialog" aria-labelledby="dialogHeading">
    <form id="taskForm" novalidate>
      <div class="dialog-header"><h2 id="dialogHeading">Новое дело</h2><button class="dialog-close" type="button" id="closeDialog" aria-label="Закрыть">×</button></div>
      <div class="dialog-content">
        <label class="field"><span>Название дела <span class="required">*</span></span><input id="taskTitle" type="text" maxlength="120" placeholder="Что нужно сделать?" autocomplete="off" required /></label>
        <label class="field"><span>Дата <span class="required">*</span></span><input id="taskDate" type="date" required /></label>
        <div class="field-row">
          <label class="field"><span>С <span class="required">*</span></span><input id="taskStart" type="time" value="09:00" required /></label>
          <label class="field"><span>До <span class="required">*</span></span><input id="taskEnd" type="time" value="10:00" required /></label>
        </div>
        <details id="advancedFields" class="advanced-fields">
          <summary>Дополнительно <span>Комментарий, повторение, категория</span></summary>
          <div class="advanced-content">
            <label class="field"><span>Комментарий</span><textarea id="taskNotes" rows="3" maxlength="5000" placeholder="Детали дела..."></textarea></label>
            <div class="field-row">
              <label class="field"><span>Категория</span><select id="taskCategory"><option value="work">Работа</option><option value="personal">Личное</option><option value="study">Учёба</option><option value="health">Здоровье</option><option value="other">Другое</option></select></label>
              <label class="field"><span>Важность</span><select id="taskPriority"><option value="normal">Обычное</option><option value="high">Важное</option></select></label>
            </div>
            <label class="field"><span>Повторение</span><select id="taskRepeat"><option value="none">Не повторять</option><option value="weekly">Каждую неделю</option></select></label>
            <p class="recurrence-hint" id="recurrenceHint" hidden>Изменение повторяющегося дела затронет всю серию.</p>
          </div>
        </details>
        <p class="form-error" id="formError" role="alert" hidden></p>
      </div>
      <div class="dialog-footer"><button class="danger-button" id="deleteTask" type="button" hidden>Удалить</button><div class="dialog-footer-actions"><button class="secondary-button" id="cancelTask" type="button">Отмена</button><button class="primary-button" id="saveTask" type="submit">Сохранить</button></div></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMessage"></span><button id="toastUndo" type="button" hidden>Отменить</button><button class="toast-close" id="toastClose" type="button" aria-label="Закрыть уведомление">×</button></div>
</body>
</html>
